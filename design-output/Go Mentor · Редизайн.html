<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Go Mentor · Редизайн (тёплая бумага)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#efece6}
  .ab-frame{width:1280px;height:860px;border:0;display:block;background:#F1EADD}
  .vlabel{font-family:"Hanken Grotesk",system-ui,sans-serif;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
  .vdot{width:11px;height:11px;border-radius:3px;display:inline-block}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

function Frame({ screen, v }) {
  return <iframe className="ab-frame" src={`screens/${screen}.html?v=${v}`} loading="lazy"></iframe>;
}

const screens = [
  { id: "dashboard",    label: "Дашборд — «Мой прогресс»" },
  { id: "roadmap",      label: "Roadmap — блок и материалы" },
  { id: "achievements", label: "Достижения — коллекция медальонов" },
  { id: "bonuses",      label: "Бонусы — баланс, скидка, заявки 1×1" },
  { id: "interviews",   label: "Собеседования — Mock/Real + каталог" },
  { id: "calendar",     label: "Календарь — месяц + ближайшие 7 дней" },
  { id: "profile",      label: "Профиль — редактирование + живое превью" },
];

function App() {
  return (
    <DesignCanvas title="Go Mentor · тёплая бумага (вариант B)" subtitle="Светлая база + тёмная тема · выбранное направление">
      {screens.map(s => (
        <DCSection key={s.id} id={s.id} title={s.label}>
          <DCArtboard id={s.id + "-b"} width={1280} height={860}
            label={<span className="vlabel"><span className="vdot" style={{background:"#5F8268"}}></span>B · Светлая (тёплая бумага)</span>}>
            <Frame screen={s.id} v="b" />
          </DCArtboard>
          <DCArtboard id={s.id + "-bd"} width={1280} height={860}
            label={<span className="vlabel"><span className="vdot" style={{background:"#8FB897"}}></span>B · Тёмная (тёплый графит)</span>}>
            <Frame screen={s.id} v="bd" />
          </DCArtboard>
        </DCSection>
      ))}
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
