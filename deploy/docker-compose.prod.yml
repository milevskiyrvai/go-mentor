# Production docker-compose для Go Mentor.
# На сервере уже работает host nginx и 6 других проектов (Proflow, TaskFusion, Vault, DateM, Alfonco, ZK-magaz).
# Поэтому встроенный nginx не используем — публикуем сервисы на loopback и проксируем через host nginx.
#
# Свободные порты на 217.198.5.195:
#   5434  → gomentor-postgres (loopback)
#   8082  → gomentor-backend (loopback)
#   8882  → gomentor-frontend-app (loopback)
#   8883  → gomentor-frontend-admin (loopback)
#
# Запуск:
#   cd /opt/gomentor
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: gomentor-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [gomentor]

  backend:
    image: gomentor-backend:latest
    build:
      context: ../backend
      dockerfile: Dockerfile
      network: host
    container_name: gomentor-backend
    environment:
      APP_ENV: ${APP_ENV}
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [gomentor]

  frontend-app:
    image: gomentor-frontend-app:latest
    build:
      context: ../frontend-app
      dockerfile: Dockerfile
      network: host
    container_name: gomentor-frontend-app
    ports:
      - "127.0.0.1:8882:80"
    depends_on: [backend]
    restart: unless-stopped
    networks: [gomentor]

  frontend-admin:
    image: gomentor-frontend-admin:latest
    build:
      context: ../frontend-admin
      dockerfile: Dockerfile
      network: host
    container_name: gomentor-frontend-admin
    ports:
      - "127.0.0.1:8883:80"
    depends_on: [backend]
    restart: unless-stopped
    networks: [gomentor]

volumes:
  postgres_data:

networks:
  gomentor:
    driver: bridge
