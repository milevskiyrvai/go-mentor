# Host nginx config для Go Mentor — кладётся в /etc/nginx/sites-available/gomentor
# и симлинкается в sites-enabled/. Использует уже установленный nginx на VPS.
#
# Применить:
#   ln -s /etc/nginx/sites-available/gomentor /etc/nginx/sites-enabled/gomentor
#   nginx -t && systemctl reload nginx
#
# SSL выдать после того как DNS подтянется:
#   certbot --nginx -d app.hakaton.consoleai.ru -d admin.hakaton.consoleai.ru \
#       --email you@example.ru --agree-tos --no-eff-email --redirect

# --- HTTP fallback (для ACME challenge и пока DNS не подтянулся) ---
server {
    listen 80;
    server_name app.hakaton.consoleai.ru;

    client_max_body_size 16M;
    server_tokens off;

    location /api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8882;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 80;
    server_name admin.hakaton.consoleai.ru;

    client_max_body_size 16M;
    server_tokens off;

    location /api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8883;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
