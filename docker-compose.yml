services:
  postgres:
    image: postgres:16-alpine
    container_name: gomentor-postgres
    environment:
      POSTGRES_USER: gomentor
      POSTGRES_PASSWORD: gomentor_dev_pwd
      POSTGRES_DB: gomentor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gomentor -d gomentor"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gomentor-backend
    environment:
      APP_ENV: development
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://gomentor:gomentor_dev_pwd@postgres:5432/gomentor?sslmode=disable
      JWT_SECRET: dev_jwt_secret_change_me_in_production
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend-app:
    build:
      context: ./frontend-app
      dockerfile: Dockerfile
    container_name: gomentor-frontend-app
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: gomentor-frontend-admin
    ports:
      - "5174:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
